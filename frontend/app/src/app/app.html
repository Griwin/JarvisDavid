<mat-sidenav-container class="layout-container">
  <mat-sidenav [mode]="'side'" [opened]="isSidebarOpen" class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-brand">
        <mat-icon>smart_toy</mat-icon>
        <span *ngIf="isSidebarOpen">JarvisDavid</span>
      </div>
    </div>

    <mat-nav-list>
      <a mat-list-item routerLink="/dashboard" routerLinkActive="active-link">
        <mat-icon matListItemIcon>dashboard</mat-icon>
        <span matListItemTitle *ngIf="isSidebarOpen">Dashboard</span>
      </a>

      <a mat-list-item routerLink="/translate" routerLinkActive="active-link">
        <mat-icon matListItemIcon>translate</mat-icon>
        <span matListItemTitle *ngIf="isSidebarOpen">Traduction</span>
      </a>

      <a mat-list-item routerLink="/summarize" routerLinkActive="active-link">
        <mat-icon matListItemIcon>article</mat-icon>
        <span matListItemTitle *ngIf="isSidebarOpen">Résumé texte</span>
      </a>

      <a mat-list-item href="#">
        <mat-icon matListItemIcon>picture_as_pdf</mat-icon>
        <span matListItemTitle *ngIf="isSidebarOpen">Résumé PDF</span>
      </a>

      <a mat-list-item href="#">
        <mat-icon matListItemIcon>history</mat-icon>
        <span matListItemTitle *ngIf="isSidebarOpen">Historique</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar color="primary" class="topbar">
      <button
        mat-icon-button
        type="button"
        aria-label="Basculer le menu"
        (click)="toggleSidebar()"
      >
        <mat-icon>menu</mat-icon>
      </button>

      <span class="topbar-title">JarvisDavid</span>
    </mat-toolbar>

    <main class="page-content">
      <router-outlet></router-outlet>
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>

services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: jarvis_php
    working_dir: /var/www/backend
    volumes:
      - ./backend:/var/www/backend
    environment:
      APP_ENV: dev
    depends_on:
      - db

  nginx:
    image: nginx:1.27-alpine
    container_name: jarvis_nginx
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www/backend
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  db:
    image: postgres:15-alpine
    container_name: jarvis_db
    environment:
      POSTGRES_DB: jarvis
      POSTGRES_USER: jarvis
      POSTGRES_PASSWORD: jarvis
    ports:
      - "5432:5432"
    volumes:
      - jarvis_pgdata:/var/lib/postgresql/data
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: jarvis_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@jarvis.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db
volumes:
  jarvis_pgdata: